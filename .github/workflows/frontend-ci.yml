name: CI — Player Portal (React / Vite)

on:
  push:
    branches: [ main, develop ]
    paths: [ 'frontend/player-portal/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'frontend/player-portal/**' ]

jobs:
  build:
    name: Build Player Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/player-portal/package-lock.json

      - name: Install dependencies
        working-directory: frontend/player-portal
        run: npm ci

      - name: Lint
        working-directory: frontend/player-portal
        run: npm run lint

      - name: Test
        working-directory: frontend/player-portal
        run: npm test

      - name: Build
        working-directory: frontend/player-portal
        env:
          VITE_API_BASE_URL: https://api.neonrush.game/v1
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: player-portal-dist
          path: frontend/player-portal/dist/
          retention-days: 7
